
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sistema_gestao_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sistema_gestao_network
  
  nginx:
    image: nginx:alpine
    container_name: sistema_gestao_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - sistema_gestao_network

  db:
    image: postgres:18
    container_name: sistema_gestao_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sistema_gestao_network

volumes:
  postgres_data:

networks:
  sistema_gestao_network:
    driver: bridge
